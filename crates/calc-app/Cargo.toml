# Dependencies are detected automatically from the binary (auto-req).

# ---- macOS (.app/.dmg) ------------------------------------------------------------------

[package.metadata.packager]
name = "sevenplus"
product-name = "SevenPlus Calculator"
identifier = "io.github.taraskornuta.sevenplus"
category = "Utility"
copyright = "Copyright © 2026 Taras Kornuta"
icons = ["../../assets/icons/sevenplus.png", "../../assets/icons/sevenplus.icns", "../../assets/icons/sevenplus.ico"]
out-dir = "../../target/packages"
binaries = [{ path = "sevenplus", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "12.0"
info-plist-path = "../../packaging/macos/Info.plist"
