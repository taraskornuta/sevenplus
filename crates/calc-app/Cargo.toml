    { source = "../../assets/icons/hicolor/16x16/apps/sevenplus.png", dest = "/usr/share/icons/hicolor/16x16/apps/sevenplus.png", mode = "644" },
    { source = "../../assets/icons/hicolor/24x24/apps/sevenplus.png", dest = "/usr/share/icons/hicolor/24x24/apps/sevenplus.png", mode = "644" },
    { source = "../../assets/icons/hicolor/32x32/apps/sevenplus.png", dest = "/usr/share/icons/hicolor/32x32/apps/sevenplus.png", mode = "644" },
    { source = "../../assets/icons/hicolor/48x48/apps/sevenplus.png", dest = "/usr/share/icons/hicolor/48x48/apps/sevenplus.png", mode = "644" },
    { source = "../../assets/icons/hicolor/64x64/apps/sevenplus.png", dest = "/usr/share/icons/hicolor/64x64/apps/sevenplus.png", mode = "644" },
