[package]
name = "sevenplus"
description = "A Windows 7 style calculator with themes: standard, scientific, programmer and statistics modes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
calc-core = { version = "0.1.0", path = "../calc-core" }
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.36.2"
egui_extras = { version = "0.36", default-features = false, features = ["datepicker"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
jiff = { version = "0.2.38", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[build-dependencies]
winresource = "0.1"

[features]
# Dev aid: SEVENPLUS_SCREENSHOT=out.png saves the first frames to a PNG and exits.
screenshot = ["dep:image"]

# ---- Linux packages ---------------------------------------------------------------------

[package.metadata.deb]
maintainer = "Taras Kornuta <taraskornuta@gmail.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
SevenPlus is a faithful clone of the Windows 7 calculator: standard, scientific, \
programmer and statistics modes, history, unit conversion, date calculation and \
worksheets. Its look is fully configurable through TOML theme files."""
assets = [
    ["target/release/sevenplus", "usr/bin/", "755"],
    ["../../packaging/linux/sevenplus.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/sevenplus.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../assets/fonts/Selawik-LICENSE.txt", "usr/share/doc/sevenplus/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/sevenplus", dest = "/usr/bin/sevenplus", mode = "755" },
    { source = "../../packaging/linux/sevenplus.desktop", dest = "/usr/share/applications/sevenplus.desktop", mode = "644" },
    { source = "../../assets/icons/sevenplus.png", dest = "/usr/share/icons/hicolor/256x256/apps/sevenplus.png", mode = "644" },
    { source = "../../assets/fonts/Selawik-LICENSE.txt", dest = "/usr/share/doc/sevenplus/Selawik-LICENSE.txt", mode = "644", doc = true },
]

# ---- macOS (.app/.dmg) and Windows (NSIS installer) ---------------------------------------

[package.metadata.packager]
product-name = "SevenPlus Calculator"
identifier = "io.github.taraskornuta.sevenplus"
category = "Utility"
copyright = "Copyright © 2026 Taras Kornuta"
icons = ["../../assets/icons/sevenplus.png", "../../assets/icons/sevenplus.icns", "../../assets/icons/sevenplus.ico"]
out-dir = "../../target/packages"
binaries = [{ path = "sevenplus", main = true }]
