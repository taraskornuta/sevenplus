[workspace]
resolver = "3"
members = [
    "crates/calc-core",
    "crates/calc-format",
    "crates/calc-theme",
    "crates/calc-config",
    "crates/calc-ui",
    "crates/calc-app",
]
default-members = ["crates/calc-app"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Taras Kornuta <taraskornuta@gmail.com>"]
repository = "https://github.com/taraskornuta/sevenplus"

[workspace.dependencies]
calc-core = { version = "0.2.0", path = "crates/calc-core" }
calc-format = { version = "0.2.0", path = "crates/calc-format" }
calc-theme = { version = "0.2.0", path = "crates/calc-theme" }
calc-config = { version = "0.2.0", path = "crates/calc-config" }
calc-ui = { version = "0.2.0", path = "crates/calc-ui" }
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
