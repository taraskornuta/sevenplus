[controls]
text = "#f2f2f2"
background = "#ffffff1f"
border = "#8e8e93"
accent = "#ff9f0a"
group_border = "#48484a"
hover = "#ffffff1f"
focus = "#0a84ff"

[bits]
text = "#ffffff"
dim = "#8e8e93"
index = "#e5e5ea"
