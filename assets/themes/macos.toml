# SevenPlus theme: macOS
# Modelled on the current macOS Calculator: a dark, see-through window with the desktop
# blurred behind it, large white digits floating on it without a box, and round
# translucent keys in three greys (functions, digits, and the lighter edit keys ⌫ AC %)
# with orange arithmetic keys. Keys brighten when pressed. Menus and Preferences are
# translucent too.
#
# The bundled font is Inter. On a Mac you can point [font] at SF Pro instead, e.g.
#     [font]
#     file = "/System/Library/Fonts/SFNS.ttf"
# in a copy of this file in the themes folder.
#
# The orange keys use dark labels: white on this orange is about 2.1:1, below the
# WCAG AA contrast that every built-in theme meets.

schema = 1
name = "macOS"
extends = "light"
# A see-through, blurred window like the real one; the keys are tinted glass on it.
backdrop = "system"
# The macOS Calculator's key arrangement and segmented controls.
layout = "mac"

[font.display]
size = 44.0
[font.button]
size = 18.0
[font.bits]
size = 14.0

[spacing]
padding = 12.0
gap = 9.0
button_width = 58.0
button_height = 46.0

[window]
background = "#1e1e1ee6"

[menu]
background = "#00000000"
text = "#f2f2f2"
hover = "#ffffff26"
hover_border = "#00000000"
popup_background = "#323234d9"
popup_border = "#ffffff1f"

[display]
background = "#00000000"
border = "#00000000"
radius = 0.0
height = 76.0
text = "#ffffff"
expression = "#b0b0b5"
indicator = "#ffffff"
history_text = "#e5e5ea"
history_hover = "#48484a"
selection = "#ff9f0a"
selection_text = "#1a1a1a"

# Round keys: the radius is capped at half the key height, so wide keys are pills.
[button]
radius = 23.0

# White glass over the dark window: functions, digits, then the edit keys.
[button.default.normal]
fill = "#ffffff2b"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.default.hover]
fill = "#ffffff38"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.default.pressed]
fill = "#ffffff4d"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.default.focus]
fill = "#ffffff2b"
border = "#0a84ff"
highlight = "#0a84ff"
text = "#ffffff"

[button.default.disabled]
fill = "#ffffff14"
border = "#00000000"
highlight = "#00000000"
text = "#8e8e93"

[button.function.normal]
fill = "#ffffff2b"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.function.hover]
fill = "#ffffff38"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.function.pressed]
fill = "#ffffff4d"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.function.focus]
fill = "#ffffff2b"
border = "#0a84ff"
highlight = "#0a84ff"
text = "#ffffff"

# Light sets its own digit fill, so every group is stated.
[button.digit.normal]
fill = "#ffffff40"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.digit.hover]
fill = "#ffffff4d"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.digit.pressed]
fill = "#ffffff5c"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.digit.focus]
fill = "#ffffff40"
border = "#0a84ff"
highlight = "#0a84ff"
text = "#ffffff"

# The edit keys (⌫, AC, %) of the macOS layout.
[button.memory.normal]
fill = "#ffffff5c"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.memory.hover]
fill = "#ffffff61"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.memory.pressed]
fill = "#ffffff40"
border = "#00000000"
highlight = "#00000000"
text = "#ffffff"

[button.memory.focus]
fill = "#ffffff5c"
border = "#0a84ff"
highlight = "#0a84ff"
text = "#ffffff"

[button.operator.normal]
fill = "#ff9f0a"
border = "#00000000"
highlight = "#00000000"
text = "#1a1a1a"

[button.operator.hover]
fill = "#ffb340"
border = "#00000000"
highlight = "#00000000"
text = "#1a1a1a"

[button.operator.pressed]
fill = "#ffc773"
border = "#00000000"
highlight = "#00000000"
text = "#1a1a1a"

[button.operator.focus]
fill = "#ff9f0a"
border = "#0a84ff"
highlight = "#0a84ff"
text = "#1a1a1a"

[button.equals.normal]
fill = "#ff9f0a"
border = "#00000000"
highlight = "#00000000"
text = "#1a1a1a"

[button.equals.hover]
fill = "#ffb340"
border = "#00000000"
highlight = "#00000000"
text = "#1a1a1a"

[button.equals.pressed]
fill = "#ffc773"
border = "#00000000"
highlight = "#00000000"
text = "#1a1a1a"

[button.equals.focus]
fill = "#ff9f0a"
border = "#0a84ff"
highlight = "#0a84ff"
