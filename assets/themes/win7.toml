# SevenPlus theme: Windows 7
#
# This file is the built-in default. Any other theme is merged on top of it, so a custom
# theme only needs the keys it changes. Copy it to a new name in the themes folder
# (View ▸ Theme ▸ Open themes folder), edit, then pick it in View ▸ Theme.
# Changes to the active theme file are applied live.
#
# Colors: "#rrggbb" or "#rrggbbaa". Gradients: a list of colors spread evenly from top
# to bottom (one color = solid fill). Sizes are in logical pixels.

name = "Windows 7"

[font]
# Path to a .ttf/.otf file (absolute, or relative to the themes folder).
# Empty = bundled Selawik (an open-source Segoe UI look-alike).
file = ""
# Menus, labels, radio buttons and the extras panel.
size = 12.0

[window]
background = ["#e3ebf6", "#d5e1f0"]
# Space around the calculator body and between its sections.
padding = 11.0

[menu]
height = 20.0
background = ["#eef3fa", "#dde6f2"]
text = "#000000"
hover = "#c5daf5"
hover_border = "#7da2ce"
popup_background = "#f5f7fb"
popup_border = "#97a5bb"

# Used when [frame] in settings.toml is "aero": a hand-drawn Windows 7 glass frame.
[titlebar]
height = 30.0
# Width of the glass border around the left, right and bottom edges.
border_width = 8.0
radius = 7.0
background = ["#c3d8f1f0", "#a9c4e8f0", "#9bb8e1f0", "#b1cbecf0"]
border = "#3b5a82"
inner_border = "#ffffff80"
text = "#000000"
text_glow = "#ffffffc0"
text_size = 12.0
button_height = 19.0
min_width = 26.0
max_width = 26.0
close_width = 43.0
button = ["#e9f0f9d0", "#cddcefd0", "#b2c7e4d0", "#cbdcf1d0"]
button_hover = ["#e6f4ff", "#bfe0fb", "#82c0f0", "#a8d6f8"]
button_border = "#4c6487"
close = ["#e9b2a6", "#d77e69", "#c4472d", "#d4694d"]
close_hover = ["#f6c4b6", "#ec8c73", "#e3482a", "#f2876b"]
glyph = "#ffffff"
glyph_outline = "#2b3e5a"
glyph_disabled = "#ffffff70"

[display]
background = ["#fbfdff", "#eaf1fa", "#dce7f5"]
border = "#8798b7"
radius = 3.0
height = 52.0
padding = 6.0
text = "#000000"
expression_text = "#4b5563"
indicator_text = "#1f2d3d"
value_size = 23.0
expression_size = 12.0
indicator_size = 11.0
# History list (View ▸ History) and the statistics data list.
history_text = "#1f2d3d"
history_size = 12.0
history_lines = 5
history_hover = "#cfe0f6"
selection = "#3d7bd4"
selection_text = "#ffffff"

[button]
width = 34.0
height = 27.0
gap = 5.0
radius = 3.0
font_size = 13.0

[button.normal]
gradient = ["#f4f7fb", "#e7edf5", "#dae2ee", "#d2dbe9"]
border = "#8191ac"
highlight = "#ffffffb0"
text = "#000000"

[button.hover]
gradient = ["#fff8de", "#ffeaa9", "#fdd672", "#fee28f"]
border = "#c79b3f"
highlight = "#ffffffc0"
text = "#000000"

[button.pressed]
gradient = ["#f6d79c", "#f3c167", "#efab43", "#f4c461"]
border = "#94702f"
highlight = "#ffffff40"
text = "#000000"

[button.disabled]
gradient = ["#f3f6f9", "#ebeff4", "#e3e8ef", "#dfe5ed"]
border = "#b6c1d1"
highlight = "#ffffff80"
text = "#a3abb8"

# Optional per-group overrides of the normal state: gradient, border, text.
# Groups: digit, operator, memory, function, equals.
# Example:
# [button.equals]
# gradient = ["#d9ecff", "#9fcbf5"]

[controls]
# Radio buttons, group boxes and the extras panel (combo boxes, text fields).
text = "#000000"
background = "#ffffff"
border = "#8e9fbd"
accent = "#2f6fc4"
group_border = "#a6b5cb"
hover = "#e3eefb"

[bits]
# Programmer mode binary bit panel.
text = "#000000"
dim = "#9aa6b8"
index = "#4f6385"
size = 11.0
